<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LibraDesk | Library Management</title><link rel="stylesheet" href="style.css"></head><body><header><div><span class="eyebrow">LIBRARY MANAGEMENT</span><h1>LibraDesk</h1><p>Catalogue · Circulation · Member records</p></div><div id="session" class="hidden"><strong id="who"></strong><span id="role"></span><button id="logout">Log out</button></div></header><main><section id="auth"><div class="auth-card"><div class="switch"><button id="loginTab" class="active">Sign in</button><button id="registerTab">Create account</button></div><form id="authForm"><input id="name" placeholder="Full name" class="hidden"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><select id="regRole" class="hidden"><option value="student">Student</option><option value="librarian">Librarian</option></select><button>Continue</button></form><p id="authMsg"></p></div></section><section id="app" class="hidden"><nav><button data-view="catalog" class="active">Catalog</button><button data-view="loans">My Loans</button><button data-view="admin" id="adminTab" class="hidden">Admin</button></nav><div id="catalogView"><div class="toolbar"><input id="search" placeholder="Search title or author..."><button id="refresh">Refresh</button></div><div id="books" class="grid"></div></div><div id="loansView" class="hidden"><h2>My lending history</h2><div id="loans"></div></div><div id="adminView" class="hidden"><h2>Library administration</h2><form id="bookForm" class="book-form"><input name="title" placeholder="Title" required><input name="author" placeholder="Author" required><input name="isbn" placeholder="ISBN" required><input name="category" placeholder="Category" required><input name="quantity" type="number" min="0" value="1" required><button>Add book</button></form><h3>Circulation ledger</h3><div id="ledger"></div><h3>Users</h3><div id="users"></div></div></section></main><div id="toast"></div><script src="app.js"></script></body></html>
